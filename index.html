
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b141a;
            --panel-bg: #111b21;
            --chat-bg: #0b141a;
            --message-out: #005c4b;
            --message-in: #202c33;
            --primary: #00a884;
            --accent: #25d366;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* شاشة تسجيل الدخول */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-card {
            background: var(--panel-bg); padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .auth-card h2 { color: var(--primary); margin-bottom: 20px; }
        .auth-card input {
            width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--text-secondary);
            border-radius: 8px; color: white; font-size: 16px;
        }
        .auth-card button {
            width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer;
        }

        /* التطبيق الرئيسي */
        #app-screen { display: none; flex-direction: column; height: 100%; width: 100%; }
        header { background: var(--panel-bg); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        header h1 { font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        header .actions i { font-size: 20px; color: var(--text-secondary); cursor: pointer; margin-left: 15px; }

        /* منطقة الدردشة */
        .chat-container { flex: 1; background: var(--chat-bg); padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; word-break: break-word; }
        .message.incoming { background: var(--message-in); align-self: flex-start; }
        .message.outgoing { background: var(--message-out); align-self: flex-end; }
        .message .time { font-size: 10px; color: var(--text-secondary); float: left; margin-top: 5px; margin-right: 10px; }

        /* صندوق الإدخال والأزرار */
        .chat-input-area { background: var(--panel-bg); padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .chat-input-area input {
            flex: 1; background: var(--bg-color); border: none; padding: 12px 15px; border-radius: 8px; color: white; font-size: 15px;
        }
        .chat-input-area button, .chat-input-area label {
            background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 5px;
        }
        .chat-input-area .send-btn { color: var(--primary); }

        /* نافذة الإعدادات */
        #settings-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .settings-content { background: var(--panel-bg); width: 90%; max-width: 400px; padding: 25px; border-radius: 12px; }
        .settings-content h3 { margin-bottom: 15px; color: var(--primary); }
        .settings-content p { margin-bottom: 15px; color: var(--text-secondary); font-size: 14px; }
        .settings-content button { width: 100%; padding: 10px; background: #d9534f; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen">
        <div class="auth-card">
            <h2>Joker Messenger</h2>
            <input type="text" id="username-input" placeholder="ادخل اسم المستخدم (مثال: زايد)">
            <button onclick="login()">دخول / تسجيل الحساب</button>
        </div>
    </div>

    <!-- شاشة التطبيق الرئيسية -->
    <div id="app-screen">
        <header>
            <h1><i class="fa-solid fa-star"></i> Joker Messenger</h1>
            <div class="actions">
                <i class="fa-solid fa-gear" onclick="toggleSettings(true)"></i>
            </div>
        </header>

        <div class="chat-container" id="chat-box">
            <!-- الرسائل تظهر هنا -->
        </div>

        <div class="chat-input-area">
            <label for="media-file"><i class="fa-solid fa-paperclip"></i></label>
            <input type="file" id="media-file" style="display:none;" onchange="sendMedia(this)">
            
            <input type="text" id="message-input" placeholder="اكتب رسالة..." onkeypress="handleKeyPress(event)">
            
            <button onclick="sendVoiceNote()"><i class="fa-solid fa-microphone"></i></button>
            <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settings-modal">
        <div class="settings-content">
            <h3>إعدادات الحساب</h3>
            <p id="current-user-display"></p>
            <button onclick="logout()">تسجيل الخروج وحذف البيانات</button>
            <button style="background:var(--text-secondary); margin-top:10px;" onclick="toggleSettings(false)">إغلاق</button>
        </div>
    </div>
